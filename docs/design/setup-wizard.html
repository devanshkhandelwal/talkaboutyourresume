<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup wizard: talkaboutyourresume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens copied from app/globals.css: paper and ink, 2px borders, hard offset shadows. */
:root {
  color-scheme: light;
  --bg:#fff; --card:#fff; --ink:#000; --ink-2:#33363d; --ink-3:#5f636b;
  --accent:#1f3fd1; --good-ink:#0b6e4f; --error-bg:#ffc7c7; --warm:#ffd8a8; --hl:#ffe45c;
  --primary-bg:#000; --primary-ink:#fff;
  --gutter:clamp(16px,4.5vw,72px);
  --font:"Schibsted Grotesk",system-ui,sans-serif;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#000; --card:#000; --ink:#fff; --ink-2:#d4d6db; --ink-3:#a1a5ad;
  --accent:#8ea2ff; --good-ink:#74e0cb; --primary-bg:#fff; --primary-ink:#000;
}
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body { font-family:var(--font); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button,input,textarea { font:inherit; color:inherit; }
.visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

.bit,.card,.btn,.pick,.chip-btn,.icon-btn,.slot,.dchip,.ptab { background:var(--card); color:var(--ink); border:2px solid var(--ink); box-shadow:3px 3px 0 var(--ink); }
.btn:active,.pick:active,.chip-btn:active,.icon-btn:active,.slot:active,.dchip:active,.ptab:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 24px; border-radius:10px; font-weight:600; font-size:17px; cursor:pointer; text-decoration:none; }
.btn-dark { background:var(--primary-bg); color:var(--primary-ink); }
.btn[disabled] { opacity:.55; cursor:not-allowed; transform:none; }
.btn-link { background:none; border:none; box-shadow:none; padding:0 4px; min-height:44px; font-weight:600; font-size:16px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.btn-link:active { transform:none; }
.card { border-radius:10px; }
.card-lg { box-shadow:5px 5px 0 var(--ink); }
.chip-btn { min-height:36px; padding:0 12px; border-radius:8px; font-size:14px; font-weight:500; cursor:pointer; }
.icon-btn { width:32px; height:32px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
.pick { text-align:left; cursor:pointer; padding:18px; border-radius:10px; display:flex; flex-direction:column; align-items:flex-start; width:100%; }
.pick[aria-checked="true"] { background:var(--ink); color:var(--card); }
.pick[aria-checked="true"] .pick-sub { color:var(--card); }
.pick-sub { color:var(--ink-2); }
.input,.textarea { width:100%; border:2px solid var(--ink); border-radius:8px; background:var(--card); padding:10px 12px; }
.input { min-height:48px; }
.input:focus,.textarea:focus,button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.subtle { color:var(--ink-3); font-size:14px; }
.muted { color:var(--ink-2); }
.display { font-weight:600; letter-spacing:-.025em; line-height:1.06; margin:0; }
.error { background:var(--error-bg); color:#000; padding:8px 12px; border-radius:8px; border:2px solid #000; font-size:14px; }

/* Header */
.site-header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; padding:24px var(--gutter); }
.wordmark { font-weight:600; font-size:20px; letter-spacing:-.01em; color:var(--ink); text-decoration:none; }
.hdr-right { display:flex; flex-wrap:wrap; align-items:center; gap:12px; }

.spinner { width:16px; height:16px; border:2px solid var(--ink); border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; flex:0 0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Layout */
.wrap { max-width:calc(960px + 2 * var(--gutter)); padding:8px var(--gutter) 48px; }

/* Discrete progress bar: one block per question. Solid = answered, hatched = you are here. */
.progress ol { list-style:none; display:flex; gap:8px; margin:0; padding:0; }
.progress li { flex:1 1 0; min-width:0; }
.seg { width:100%; background:none; border:none; padding:0; text-align:left; cursor:default; }
.seg[data-clickable="true"] { cursor:pointer; }
.seg .bar { display:block; height:16px; border:2px solid var(--ink); background:var(--card); }
.seg.done .bar { background:var(--ink); }
.seg.current .bar { background:repeating-linear-gradient(135deg,var(--ink) 0 2px,var(--card) 2px 6px); }
.seg .lbl { display:block; margin-top:8px; font-size:13px; font-weight:500; color:var(--ink-3); }
.seg.current .lbl { color:var(--ink); font-weight:700; }
.seg.done .lbl { color:var(--ink); }
.seg[data-clickable="true"]:hover .bar { box-shadow:2px 2px 0 var(--ink); }
.count { margin:10px 0 0; font-size:14px; color:var(--ink-3); }
@media (max-width:560px) { .seg .lbl { display:none; } }
@media (min-width:561px) { .count { display:none; } }

/* Steps */
.step { margin-top:40px; animation:in .16s ease-out; }
@keyframes in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion:reduce) { .step { animation:none; } .spinner { animation-duration:2s; } }
.step h1 { font-size:clamp(2rem,4vw,3rem); outline:none; }
.step .lede { margin:10px 0 0; max-width:640px; }
.options { display:grid; gap:16px; margin-top:28px; }
.options.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
.options.mode { grid-template-columns:repeat(3,minmax(0,1fr)); }
@media (max-width:860px) { .options.three,.options.mode { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:560px) { .options.three,.options.mode { grid-template-columns:1fr; } }
.pick .name { font-weight:600; font-size:1.0625rem; }
.pick .sub { margin-top:4px; font-size:14px; line-height:1.4; }
.pick .lvl { margin-top:12px; font-size:13px; font-weight:600; }
.pick .top { display:flex; justify-content:space-between; width:100%; align-items:flex-start; }
.pro { font-size:12px; font-weight:600; border:2px solid currentColor; border-radius:6px; padding:0 6px; }

.bubble { position:relative; margin:22px 0 0; max-width:520px; border:2px solid var(--ink); border-radius:10px; padding:10px 14px; box-shadow:3px 3px 0 var(--ink); background:var(--card); }
.bubble b { display:block; font-size:13px; color:var(--ink-3); font-weight:500; }

.nav { display:flex; align-items:center; gap:16px; margin-top:36px; }
.navbar-spacer { flex:1; }
.backrow { margin-top:28px; }
@media (max-width:640px) {
  .nav { position:fixed; left:0; right:0; bottom:0; margin:0; padding:12px var(--gutter); background:var(--bg); border-top:2px solid var(--ink); z-index:5; }
  .nav .btn-dark { flex:1; }
  .wrap { padding-bottom:112px; }
}

/* Questions step */
.qform { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; max-width:760px; }
.qform .input { flex:1 1 320px; }
.qlist { list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; max-width:760px; }
.qlist li { padding:8px 8px 8px 14px; }
.qrow { display:flex; align-items:center; gap:12px; }
.qrow span.t { flex:1 1 auto; min-width:0; overflow-wrap:anywhere; }
.chips { margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }

/* Final step */
.final { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:40px; margin-top:28px; align-items:start; }
@media (max-width:820px) { .final { grid-template-columns:1fr; } }
.rows { margin:0; padding:0; list-style:none; border:2px solid var(--ink); border-radius:10px; box-shadow:5px 5px 0 var(--ink); }
.rows li { display:flex; justify-content:space-between; gap:16px; align-items:baseline; padding:14px 16px; }
.rows li + li { border-top:2px solid var(--ink); }
.rows dt,.rows .k { color:var(--ink-3); font-size:14px; }
.rows .v { font-weight:600; text-align:right; }
.rows .v small { display:block; font-weight:400; color:var(--ink-3); font-size:13px; }
.rows button.chg { background:none; border:none; padding:0; margin-left:10px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; font-size:14px; font-weight:500; }
.preview { text-align:center; padding:20px; }
.preview svg { display:block; margin:0 auto; }
.preview p { margin:10px 0 0; font-weight:600; }
.reassure { margin-top:20px; padding:12px 14px; border:2px dashed var(--ink); border-radius:10px; font-size:15px; }
.reassure b { font-weight:600; }
.actions { display:flex; flex-wrap:wrap; gap:14px; margin-top:24px; align-items:center; }
.actions .btn-dark { min-height:56px; font-size:18px; }

/* Scheduler: date strip, period tabs, 15-minute slots */
.sched { margin-top:28px; }
.dates { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.dchip { min-width:76px; padding:8px 12px; border-radius:8px; cursor:pointer; text-align:center; line-height:1.2; }
.dchip small { display:block; font-size:12px; color:var(--ink-3); }
.dchip[aria-pressed="true"],.ptab[aria-pressed="true"],.slot[aria-pressed="true"] { background:var(--ink); color:var(--card); }
.dchip[aria-pressed="true"] small { color:var(--card); }
.ptabs { display:flex; gap:10px; margin-top:22px; }
.ptab { min-height:40px; padding:0 14px; border-radius:8px; font-weight:600; font-size:15px; cursor:pointer; }
.ptab[disabled] { opacity:.4; cursor:not-allowed; box-shadow:none; }
.slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:16px; }
.slot { min-height:42px; border-radius:8px; font-size:15px; font-weight:500; cursor:pointer; font-variant-numeric:tabular-nums; }
.slot[disabled] { border-style:dashed; color:var(--ink-3); box-shadow:none; cursor:not-allowed; text-decoration:line-through; }
.pickedline { margin:22px 0 0; font-weight:600; font-size:18px; }
.pickedline small { display:block; font-weight:400; color:var(--ink-3); font-size:14px; }

/* Prototype-only controls, not part of the design */
.proto { margin:0 var(--gutter) 96px; font-size:12.5px; background:#fff8c2; color:#000; border:2px solid #000; border-radius:8px; padding:8px 10px; max-width:300px; }
.proto summary { cursor:pointer; font-weight:700; }
.proto .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.proto button { border:1.5px solid #000; background:#fff; color:#000; border-radius:6px; padding:3px 8px; cursor:pointer; font-size:12.5px; }
.proto button[aria-pressed="true"] { background:#000; color:#fff; }
</style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="#" onclick="return false">talkaboutyourresume</a>
  <div class="hdr-right">
    <span class="subtle">Up to 15 minutes, free</span>
  </div>
</header>
<main class="wrap">
  <nav class="progress" id="progress" aria-label="Setup progress"></nav>
  <div id="app"></div>
</main>

<details class="proto" id="proto">
  <summary>Prototype controls</summary>
  <div class="row"><span>Resume:</span>
    <button data-p="reading">Reading</button><button data-p="ready">Ready</button><button data-p="failed">Failed</button></div>
  <div class="row"><span>Theme:</span><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
  <div class="row"><button data-p="restart">Restart</button></div>
  <p style="margin:8px 0 0">Not part of the design. The resume is read silently in the background. Only a failed read shows anything, on the last step.</p>
</details>

<script>
const MODES = [
  { id: "mixed", label: "Resume + your questions", blurb: "Digs into your resume, plus any questions you add." },
  { id: "resume", label: "Just my resume", blurb: "Only follow-ups on what your resume says." },
  { id: "general", label: "General questions", blurb: "Classic behavioral and motivation questions, answered from your own experience." },
];
const WHO = [
  { id: "friendly", name: "The Friendly One", level: "Easy", pro: false, blurb: "Warm, patient, gives you room. Great for a first run.", sample: "Take your time. Tell me about the project you are proudest of." },
  { id: "manager", name: "The Hiring Manager", level: "Medium", pro: false, blurb: "Less about details, more about judgment and fit.", sample: "Why this role, and what would your first month look like?" },
  { id: "silent", name: "The Silent Type", level: "Medium", pro: true, blurb: "Short questions, long pauses. Trains you not to ramble.", sample: "Go on." },
  { id: "rusher", name: "The Rusher", level: "Medium", pro: true, blurb: "Interrupts and asks you to get to the point.", sample: "Sorry, quick version please. What was the result?" },
  { id: "skeptic", name: "The Skeptic", level: "Hard", pro: true, blurb: "Politely doubts you. Wants to know what was really yours.", sample: "That sounds like a team effort. What did you do?" },
  { id: "griller", name: "The Griller", level: "Hard", pro: true, blurb: "Pushes on every vague claim until you get specific.", sample: "Improved by how much? Measured how? Says who?" },
];
const SUGGESTED = ["Tell me about yourself.", "Why do you want to work here?", "Tell me about a time you failed.", "What's your biggest weakness?", "Tell me about a disagreement with a teammate."];
const MAXQ = 5, EVENT_MIN = 20;
const LOOKS = {
  friendly:{bg:"#F2B84B",skin:"#F1C7A3",hair:"#6B3E26",shirt:"#FFFFFF",hairD:"M28 50 C25 28 38 18 51 19 C66 20 76 30 72 52 C70 40 65 32 57 30 C49 35 38 36 31 41 Z",browD:"M37 40 Q41.5 36.5 46 40 M54 40 Q58.5 36.5 63 40",mouthD:"M42 57 Q50 64 58 57",glasses:false},
  manager:{bg:"#2B4BF2",skin:"#8D5A3B",hair:"#1E1E24",shirt:"#1E2A5A",hairD:"M30 42 C30 26 42 21 52 21 C63 21 71 28 70 42 C66 33 58 30 50 30 C42 30 34 34 30 42 Z",browD:"M37 40 L46 39.4 M54 39.4 L63 40",mouthD:"M43 58 Q50 62 57 58",glasses:false},
  silent:{bg:"#4A4A52",skin:"#E8B996",hair:"#2E2A26",shirt:"#1E1E24",hairD:"M28 52 C26 28 38 20 50 20 C64 20 74 28 72 52 L72 68 C70 56 70 40 64 34 C56 30 44 30 36 34 C30 40 30 56 28 68 Z",browD:"M37 41 L46 41 M54 41 L63 41",mouthD:"M44 59 L56 59",glasses:false},
  rusher:{bg:"#0B6B5E",skin:"#C68B5E",hair:"#1E1E24",shirt:"#FFFFFF",hairD:"M30 40 L33 25 L39 33 L44 19 L50 31 L56 18 L61 32 L67 24 L70 40 C64 33 36 33 30 40 Z",browD:"M37 39.5 L46 37 M54 37 L63 39.5",mouthD:"M43 58 Q50 61 57 58",glasses:false},
  skeptic:{bg:"#6A2FD0",skin:"#F5D0B5",hair:"#B5702E",shirt:"#F3F3F5",hairD:"M29 44 C28 27 41 20 53 21 C65 22 72 30 71 44 C64 30 52 27 40 34 C35 37 31 40 29 44 Z",browD:"M37 41 L46 41 M54 38.5 Q58.5 34.5 63 38",mouthD:"M44 59 Q52 61 57 56.5",glasses:false},
  griller:{bg:"#C4421E",skin:"#A86F4C",hair:"#7A7A80",shirt:"#1E1E24",hairD:"M29 46 C29 38 31 33 34 31 L34 46 Z M71 46 C71 38 69 33 66 31 L66 46 Z",browD:"M36 38 L46 41.5 M54 41.5 L64 38",mouthD:"M44 60 Q50 57.5 56 60",glasses:true},
};
function avatar(id, size) {
  const l = LOOKS[id];
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="${l.bg}"/><path d="M18 100 C22 80 38 74 50 74 C62 74 78 80 82 100 Z" fill="${l.shirt}"/><rect x="44" y="64" width="12" height="12" rx="4" fill="${l.skin}"/><ellipse cx="50" cy="46" rx="20" ry="23" fill="${l.skin}"/><path d="${l.hairD}" fill="${l.hair}"/><circle cx="42" cy="47" r="2.4" fill="#1E1E24"/><circle cx="58" cy="47" r="2.4" fill="#1E1E24"/><path d="${l.browD}" fill="none" stroke="#1E1E24" stroke-width="2" stroke-linecap="round"/>${l.glasses ? '<g fill="none" stroke="#1E1E24" stroke-width="1.6"><circle cx="42" cy="47" r="6"/><circle cx="58" cy="47" r="6"/><path d="M48 47 L52 47"/></g>' : ""}<path d="${l.mouthD}" fill="none" stroke="#3A1F1F" stroke-width="2" stroke-linecap="round"/></svg>`;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const fmtMin = (t) => { const h = Math.floor(t / 60), m = t % 60; return `${((h + 11) % 12) + 1}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const ICON = {
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  x: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};

const S = { step: 0, completed: new Set(), mode: "mixed", who: "manager", questions: [], plans: {}, open: new Set(), draft: "", err: "",
  resume: "reading", schedule: false, dateIdx: 0, slot: null, period: "morning", added: false, started: false };
let lastStep = -1, readTimer;

const steps = () => [
  { id: "mode", label: "Practice" },
  { id: "who", label: "Interviewer" },
  ...(S.mode !== "resume" ? [{ id: "q", label: "Questions" }] : []),
  { id: "go", label: "Start" },
];
const cur = () => steps()[Math.min(S.step, steps().length - 1)];
const who = () => WHO.find((w) => w.id === S.who);
const mode = () => MODES.find((m) => m.id === S.mode);

function startResumeSim() {
  clearTimeout(readTimer);
  S.resume = "reading";
  readTimer = setTimeout(() => { if (S.resume === "reading") { S.resume = "ready"; render(); } }, 7000);
}

/* ---- Pieces ---- */
function progress() {
  const st = steps();
  const html = st.map((s, i) => {
    const done = S.completed.has(s.id) && i !== S.step;
    const current = i === S.step;
    const clickable = done;
    return `<li><button class="seg ${current ? "current" : done ? "done" : ""}" data-clickable="${clickable}" ${clickable ? `data-a="goto" data-i="${i}"` : "disabled"} aria-current="${current ? "step" : "false"}" aria-label="${s.label}${done ? ", answered" : ""}"><span class="bar"></span><span class="lbl">${s.label}</span></button></li>`;
  }).join("");
  return `<ol>${html}</ol><p class="count" aria-live="polite">Step ${S.step + 1} of ${st.length}: ${cur().label}</p>`;
}
function navBar(primaryLabel, opts = {}) {
  const back = S.step > 0 ? `<button class="btn-link" data-a="back">Back</button>` : "";
  return `<div class="nav">${back}<span class="navbar-spacer"></span><button class="btn btn-dark" data-a="next">${primaryLabel} ${ICON.arrow}</button></div>`;
}

/* ---- Steps ---- */
function stepMode() {
  return `<section class="step"><h1 class="display" tabindex="-1" id="h">What do you want to practice?</h1>
  <p class="lede muted">Pick one. You can change it before you start.</p>
  <div class="options mode" role="radiogroup" aria-labelledby="h">${MODES.map((m) => `<button class="pick" role="radio" aria-checked="${m.id === S.mode}" data-a="mode" data-v="${m.id}"><span class="name">${m.label}</span><span class="pick-sub sub">${m.blurb}</span></button>`).join("")}</div>
  ${navBar("Continue")}</section>`;
}
function stepWho() {
  return `<section class="step"><h1 class="display" tabindex="-1" id="h">Pick your interviewer</h1>
  <p class="lede muted">Real interviewers come in every style. Practice against the one that scares you most.</p>
  <div class="options three" role="radiogroup" aria-labelledby="h">${WHO.map((w) => `<button class="pick" role="radio" aria-checked="${w.id === S.who}" data-a="who" data-v="${w.id}"><span class="top">${avatar(w.id, 64)}${w.pro ? '<span class="pro">Pro, free in beta</span>' : ""}</span><span class="name" style="margin-top:14px">${w.name}</span><span class="pick-sub sub">${w.blurb}</span><span class="pick-sub lvl">${w.level}</span></button>`).join("")}</div>
  <p class="bubble" aria-live="polite"><b>${who().name} might open with</b>&ldquo;${esc(who().sample)}&rdquo;</p>
  ${navBar("Continue")}</section>`;
}
function stepQ() {
  const left = MAXQ - S.questions.length;
  return `<section class="step"><h1 class="display" tabindex="-1" id="h">Any questions you want to practice?</h1>
  <p class="lede muted">Your interviewer asks each one in their own words, along with ${S.mode === "general" ? "a few classic behavioral questions" : "questions about your resume"}. Optional, up to ${MAXQ}.</p>
  <form class="qform" data-a="addq"><label class="visually-hidden" for="nq">Question to practice</label><input id="nq" class="input" maxlength="200" value="${esc(S.draft)}" placeholder="Tell me about a time you disagreed with your manager." autocomplete="off"><button type="submit" class="btn btn-dark" style="min-height:48px;font-size:15px" ${S.draft.trim() ? "" : "disabled"}>Add question</button></form>
  ${S.err ? `<p class="error" role="alert" style="margin-top:10px;max-width:760px">${S.err}</p>` : ""}
  ${S.questions.length ? `<ul class="qlist" aria-label="Your questions">${S.questions.map((q, i) => `<li class="card"><div class="qrow"><span class="t">${esc(q)}</span>${S.open.has(q) ? "" : `<button class="chip-btn" data-a="plan" data-q="${i}">${S.plans[q] ? "Edit your answer" : "+ How you'd answer"}</button>`}<button class="icon-btn" aria-label="Remove question: ${esc(q)}" data-a="rmq" data-q="${i}">${ICON.x}</button></div>${S.open.has(q) ? `<div style="margin:10px 6px 6px 0"><label class="subtle" style="display:block;margin-bottom:6px" for="p${i}">How you'd answer. Bullet points are fine. The interviewer won't see this; your results compare it with what you said.</label><textarea id="p${i}" class="textarea" rows="3" maxlength="1500" data-a="planText" data-q="${i}">${esc(S.plans[q] || "")}</textarea><button class="chip-btn" style="margin-top:8px" data-a="planDone" data-q="${i}">Done</button></div>` : S.plans[q] && S.plans[q].trim() ? `<p class="subtle" style="margin:6px 6px 2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Your answer: ${esc(S.plans[q])}</p>` : ""}</li>`).join("")}</ul>` : ""}
  <p class="subtle" style="margin:12px 0 0" aria-live="polite">${S.questions.length} of ${MAXQ} added</p>
  ${left > 0 ? `<div class="chips"><span class="subtle">Suggestions:</span>${SUGGESTED.filter((s) => !S.questions.includes(s)).map((s) => `<button class="chip-btn" data-a="sugg" data-v="${esc(s)}">+ ${esc(s)}</button>`).join("")}</div>` : ""}
  ${navBar(S.questions.length ? "Continue" : "Skip, no questions")}</section>`;
}
function summary() {
  const nq = S.mode === "resume" ? "Not in this mode" : S.questions.length ? `${S.questions.length} of ${MAXQ}${S.questions.some((q) => (S.plans[q] || "").trim()) ? `, ${S.questions.filter((q) => (S.plans[q] || "").trim()).length} planned` : ""}` : "None";
  return `<ul class="rows"><li><span class="k">Practicing</span><span class="v">${mode().label}<button class="chg" data-a="goto" data-i="0">Change</button></span></li>
  <li><span class="k">Interviewer</span><span class="v">${who().name}<small>${who().level}${who().pro ? ", free in beta" : ""}</small><button class="chg" data-a="goto" data-i="1">Change</button></span></li>
  ${S.mode !== "resume" ? `<li><span class="k">Your questions</span><span class="v">${nq}<button class="chg" data-a="goto" data-i="2">Change</button></span></li>` : ""}
  ${S.resume === "failed" ? `<li><span class="k">Resume</span><span class="v">Couldn't read it<small>General questions only</small><button class="chg" data-a="replace">Try another</button></span></li>` : ""}
  <li><span class="k">Length</span><span class="v">Up to 15 min</span></li></ul>`;
}
function reassure() {
  if (S.resume === "failed") return `<p class="reassure"><b>We couldn't read your resume.</b> Try another file, or start now with general questions only.</p>`;
  return "";
}
function stepGo() {
  const w = who();
  const failed = S.resume === "failed";
  return `<section class="step"><h1 class="display" tabindex="-1" id="h">Ready when you are</h1>
  <p class="lede muted">Start now, or put it on your calendar for later.</p>
  <div class="final"><div>${summary()}
    ${S.schedule ? scheduler() : `<div class="actions"><button class="btn btn-dark" data-a="start">${failed ? "Start with general questions" : "Start interview"} ${ICON.arrow}</button><button class="btn" data-a="sched">${ICON.cal} Schedule for later</button></div>${reassure() || '<p class="subtle" style="margin:12px 0 0">Starts right away. Use headphones if you can.</p>'}`}
  </div>
  <aside class="card card-lg preview" aria-label="Your interviewer">${avatar(w.id, 104)}<p>${w.name}</p><p class="bubble" style="margin:14px 0 0;text-align:left;box-shadow:none">&ldquo;${esc(w.sample)}&rdquo;</p></aside></div>
  ${S.step > 0 ? `<div class="backrow"><button class="btn-link" data-a="back">Back</button></div>` : ""}</section>`;
}

/* ---- Scheduler: 15-minute slots ---- */
function days() { return Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() + i); d.setHours(0, 0, 0, 0); return d; }); }
function slotsFor(date) {
  const out = [], limit = Date.now() + 15 * 60000;
  for (let t = 6 * 60; t <= 22 * 60 + 45; t += 15) { const d = new Date(date); d.setMinutes(t); out.push({ t, off: d.getTime() <= limit, d }); }
  return out;
}
const periodOf = (t) => (t < 720 ? "morning" : t < 1020 ? "afternoon" : "evening");
function defaultSlot() {
  const ahead = new Date(Date.now() + 60 * 60000), t = Math.ceil((ahead.getHours() * 60 + ahead.getMinutes()) / 15) * 15;
  const sameDay = ahead.toDateString() === new Date().toDateString();
  if (sameDay && t >= 360 && t <= 22 * 60 + 45) { S.dateIdx = 0; S.slot = t; } else { S.dateIdx = 1; S.slot = 9 * 60; }
  S.period = periodOf(S.slot);
}
function scheduler() {
  const ds = days(), date = ds[S.dateIdx], all = slotsFor(date);
  const tabs = ["morning", "afternoon", "evening"];
  const inP = (p) => all.filter((s) => periodOf(s.t) === p);
  const start = new Date(date); start.setMinutes(S.slot ?? 0);
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  return `<div class="sched"><h2 class="display" style="font-size:1.5rem">Pick a time</h2>
  <div class="dates" role="group" aria-label="Day">${ds.map((d, i) => `<button class="dchip" aria-pressed="${i === S.dateIdx}" data-a="date" data-i="${i}">${i === 0 ? "Today" : i === 1 ? "Tomorrow" : d.toLocaleDateString(undefined, { weekday: "short" })}<small>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></button>`).join("")}</div>
  <div class="ptabs" role="group" aria-label="Time of day">${tabs.map((p) => `<button class="ptab" aria-pressed="${S.period === p}" data-a="period" data-v="${p}" ${inP(p).every((s) => s.off) ? "disabled" : ""}>${p[0].toUpperCase() + p.slice(1)}</button>`).join("")}</div>
  <div class="slots" role="group" aria-label="Start time, every 15 minutes">${inP(S.period).map((s) => `<button class="slot" aria-pressed="${s.t === S.slot}" data-a="slot" data-slot="${s.t}" ${s.off ? "disabled" : ""}>${fmtMin(s.t)}</button>`).join("")}</div>
  ${S.slot != null ? `<p class="pickedline">${date.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}, ${fmtMin(S.slot)}<small>${EVENT_MIN} minute block (${15} + 5 to settle in) · ${tz}</small></p>
  <div class="actions"><a class="btn btn-dark" target="_blank" rel="noopener" href="${gcal(start)}" data-a="added">${ICON.cal} Add to Google Calendar</a><button class="btn" data-a="ics">Apple or Outlook (.ics)</button><button class="btn-link" data-a="unsched">Start now instead</button></div>` : `<div class="actions"><button class="btn-link" data-a="unsched">Start now instead</button></div>`}
  ${S.added ? `<p class="subtle" role="status" style="margin:12px 0 0">Added. At that time, open the link and upload your resume again, since it isn't saved. Your interviewer and practice mode will already be picked.</p>` : ""}</div>`;
}
const LINK = () => `https://talkaboutyourresume.vercel.app/?i=${S.who}&m=${S.mode}`;
const stamp = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function gcal(start) {
  const end = new Date(start.getTime() + EVENT_MIN * 60000);
  return "https://calendar.google.com/calendar/render?" + new URLSearchParams({ action: "TEMPLATE", text: "Interview practice (talkaboutyourresume)", dates: `${stamp(start)}/${stamp(end)}`, details: `Practice talking about your resume, out loud. Open ${LINK()} (upload your resume again; it isn't saved). Headphones help.`, location: LINK() });
}
function downloadIcs() {
  const date = days()[S.dateIdx]; const start = new Date(date); start.setMinutes(S.slot); const end = new Date(start.getTime() + EVENT_MIN * 60000);
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//talkaboutyourresume//practice//EN", "BEGIN:VEVENT", `UID:${stamp(start)}@talkaboutyourresume`, `DTSTAMP:${stamp(new Date())}`, `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`, "SUMMARY:Interview practice (talkaboutyourresume)", `URL:${LINK()}`, "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:Interview practice in 10 minutes", "TRIGGER:-PT10M", "END:VALARM", "END:VEVENT", "END:VCALENDAR"];
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([lines.join("\r\n") + "\r\n"], { type: "text/calendar" })); a.download = "interview-practice.ics"; a.click();
}

/* ---- Hand-off screen (shows what happens next) ---- */
function handoff() {
  return `<section class="step"><h1 class="display" tabindex="-1" id="h">Next: the mic check</h1>
  <p class="lede muted">This is where the existing interview screen takes over, with ${who().name}${S.resume === "failed" ? " on general questions" : ""}.</p>
  <ul class="rows" style="margin-top:24px;max-width:640px"><li><span class="k">First minutes</span><span class="v">Small talk, then "walk me through your background"<small>No resume topics needed yet</small></span></li></ul>
  <div class="nav"><button class="btn-link" data-a="unstart">Back to setup</button></div></section>`;
}

/* ---- Render ---- */
function render() {
  const app = document.getElementById("app"), prog = document.getElementById("progress");
  if (S.started) { prog.innerHTML = ""; app.innerHTML = handoff(); }
  else {
    prog.innerHTML = progress();
    const id = cur().id;
    if (S.step !== lastStep || app.dataset.id !== id) app.innerHTML = { mode: stepMode, who: stepWho, q: stepQ, go: stepGo }[id]();
    else app.innerHTML = { mode: stepMode, who: stepWho, q: stepQ, go: stepGo }[id]();
    app.querySelectorAll(".step").forEach((el) => { if (S.step === lastStep) el.style.animation = "none"; });
    app.dataset.id = id;
  }
  if (S.step !== lastStep || S.started) { const h = document.getElementById("h"); if (h) h.focus({ preventScroll: true }); window.scrollTo({ top: 0 }); }
  lastStep = S.step;
  document.querySelectorAll(".proto [data-p]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === S.resume)));
  document.querySelectorAll(".proto [data-t]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.t === "dark") === (document.documentElement.dataset.theme === "dark"))));
}

function next() {
  S.completed.add(cur().id);
  S.step = Math.min(S.step + 1, steps().length - 1);
  if (cur().id === "go" && S.slot == null) defaultSlot();
  render();
}
document.addEventListener("click", (e) => {
  const p = e.target.closest(".proto [data-p]");
  if (p) { const v = p.dataset.p; if (v === "restart") { Object.assign(S, { step: 0, completed: new Set(), mode: "mixed", who: "manager", questions: [], plans: {}, open: new Set(), draft: "", err: "", schedule: false, slot: null, added: false, started: false }); startResumeSim(); } else { clearTimeout(readTimer); S.resume = v; } return render(); }
  const t = e.target.closest(".proto [data-t]"); if (t) { document.documentElement.dataset.theme = t.dataset.t; return render(); }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a === "mode") { S.mode = el.dataset.v; render(); }
  else if (a === "who") { S.who = el.dataset.v; render(); }
  else if (a === "next") next();
  else if (a === "back") { S.step = Math.max(0, S.step - 1); S.schedule = false; render(); }
  else if (a === "goto") { S.step = Number(el.dataset.i); S.schedule = false; render(); }
  else if (a === "sugg") { addQ(el.dataset.v); }
  else if (a === "rmq") { const q = S.questions[+el.dataset.q]; S.questions.splice(+el.dataset.q, 1); delete S.plans[q]; S.open.delete(q); S.err = ""; render(); }
  else if (a === "plan") { S.open.add(S.questions[+el.dataset.q]); render(); const ta = document.getElementById("p" + el.dataset.q); ta && ta.focus(); }
  else if (a === "planDone") { S.open.delete(S.questions[+el.dataset.q]); render(); }
  else if (a === "sched") { S.schedule = true; S.added = false; render(); }
  else if (a === "unsched") { S.schedule = false; render(); }
  else if (a === "date") { S.dateIdx = +el.dataset.i; const first = slotsFor(days()[S.dateIdx]).find((s) => !s.off); if (first && (S.slot == null || slotsFor(days()[S.dateIdx]).find((s) => s.t === S.slot)?.off)) { S.slot = first.t; S.period = periodOf(first.t); } S.added = false; render(); }
  else if (a === "period") { S.period = el.dataset.v; render(); }
  else if (a === "slot") { S.slot = +el.dataset.slot; S.added = false; render(); }
  else if (a === "ics") { downloadIcs(); S.added = true; render(); }
  else if (a === "added") { S.added = true; setTimeout(render, 0); }
  else if (a === "start") { S.started = true; render(); }
  else if (a === "unstart") { S.started = false; render(); }
  else if (a === "replace") { clearTimeout(readTimer); startResumeSim(); render(); }
});
function addQ(text) {
  const q = text.replace(/\s+/g, " ").trim().slice(0, 200); if (!q) return;
  if (S.questions.length >= MAXQ) { S.err = `You can add up to ${MAXQ} questions. Remove one to add another.`; return render(); }
  if (S.questions.some((x) => x.toLowerCase() === q.toLowerCase())) { S.err = "That question is already on your list."; return render(); }
  S.questions.push(q); S.draft = ""; S.err = ""; render(); const i = document.getElementById("nq"); i && i.focus();
}
document.addEventListener("submit", (e) => { if (e.target.dataset.a === "addq") { e.preventDefault(); addQ(S.draft); } });
document.addEventListener("input", (e) => {
  if (e.target.id === "nq") { S.draft = e.target.value; S.err = ""; const b = e.target.form.querySelector("button[type=submit]"); b.disabled = !S.draft.trim(); }
  if (e.target.dataset.a === "planText") { S.plans[S.questions[+e.target.dataset.q]] = e.target.value; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !["TEXTAREA", "INPUT", "BUTTON", "A", "SUMMARY"].includes(e.target.tagName) && !S.started && cur().id !== "go") next();
  const radio = e.target.closest('[role="radio"]');
  if (radio && ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp"].includes(e.key)) {
    const all = [...radio.parentElement.querySelectorAll('[role="radio"]')], i = all.indexOf(radio), d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1;
    const n = all[(i + d + all.length) % all.length]; n.focus(); n.click(); e.preventDefault();
  }
});
startResumeSim();
render();
</script>
</body>
</html>
